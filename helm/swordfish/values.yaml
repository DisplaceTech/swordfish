nameOverride: ""
fullnameOverride: ""

server:
  replicaCount: 1
  image:
    repository: ghcr.io/displacetech/swordfish/server
    tag: "latest"
    sha: ""
    pullPolicy: Always
  # Image pull secrets configuration
  imagePullSecrets:
    # -- Create a pull secret using provided credentials
    create: false
    # -- Name of existing pull secret to use
    name: ""
    # -- GitHub credentials if creating pull secret
    github:
      username: ""
      token: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    SERVER_PORT: "8080"

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false  # Ephemeral storage since secrets expire in 24h anyway
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

keel:
  # -- Keel update policy: "force" for latest tag, "semver" for tagged releases, "glob" for pattern matching
  policy: "force"
  # -- Keel trigger type: "poll" to periodically check for new images, "pubsub" for event-driven updates
  trigger: "poll"
  # -- Poll schedule (cron or @every syntax); only used when trigger is "poll"
  pollSchedule: "@every 5m"
  # -- Only update when the image tag matches the currently deployed tag
  matchTag: "true"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: swordfish.local
      paths:
        - path: /
          pathType: Prefix
  tls: [] 