swagger: "2.0"
info:
  description: "This is a basic API for setting and retrieving secret values from a server."
  version: "1.0.0"
  title: "Project Swordfish"
  contact:
    email: "eric@eamann.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
host: "swordfish.displace.tech"
basePath: "/"
tags:
  - name: "front-end"
    description: "The public front-end of the application. An otherwise static web application."
  - name: "api"
    description: "The request/response API of the system used by both the front-end UI and CLI tools."
schemes:
  - "https"
paths:
  /:
    get:
      summary: "Get the static homepage for creating secrets."
      tags:
        - "front-end"
      produces:
        - "text/html"
      responses:
        "200":
          description: "OK"
  /secret:
    get:
      summary: "Get an empty secret retrieval page."
      tags:
        - "front-end"
      produces:
        - "text/html"
      responses:
        "200":
          description: "OK"
  /secret/{secretId}:
    get:
      summary: "Get a pre-populated secret retrieval page."
      tags:
        - "front-end"
      parameters:
        - name: "secretId"
          in: "path"
          description: "ID of secret to return"
          required: true
          type: "string"
      produces:
        - "text/html"
      responses:
        "200":
          description: "OK"

  /health:
    get:
      summary: "Check service health including Redis connectivity."
      tags:
        - "api"
      produces:
        - "application/json"
      responses:
        "200":
          description: "Service is healthy"
          schema:
            type: "object"
            properties:
              status:
                type: "string"
                example: "ok"
        "503":
          description: "Service unavailable — Redis unreachable"
          schema:
            type: "object"
            properties:
              status:
                type: "string"
                example: "error"
              message:
                type: "string"
                example: "Connection refused [tcp://redis:6379]"

  /create:
    post:
      summary: "Create a new secret (deprecated — redirects to /api/create)."
      tags:
        - "api"
      consumes:
        - "text/plain"
      produces:
        - "text/plain"
      parameters:
        - in: "body"
          name: "body"
          description: "Serialized secret to store in the server."
          required: true
          schema:
            type: "string"
      responses:
        "307":
          description: "Temporary Redirect to /api/create"
  /api/create:
    post:
      summary: "Create a new secret in the datastore."
      tags:
        - "api"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "JSON payload containing the encrypted secret and optional metadata."
          required: true
          schema:
            type: "object"
            required:
              - "encrypted_secret"
            properties:
              encrypted_secret:
                type: "string"
                description: "The client-side encrypted secret payload."
              ttl:
                type: "integer"
                description: "Secret lifetime in seconds (1–604800). Defaults to 86400."
                default: 86400
              max_views:
                type: "integer"
                description: "Maximum number of times the secret may be retrieved. Defaults to 1."
                default: 1
      responses:
        "201":
          description: "Created"
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                description: "Unique identifier for the stored secret."
              expires_at:
                type: "integer"
                description: "Unix timestamp when the secret expires."
              max_views:
                type: "integer"
                description: "Maximum number of retrievals allowed."
        "400":
          description: "Bad Request"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Bad Request"
        "413":
          description: "Payload Too Large"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Payload Too Large"
        "422":
          description: "Unprocessable Entity — TTL or max_views out of range"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "TTL must be between 1 and 604800 seconds."
  /api/retrieve:
    post:
      summary: "Retrieve a secret from the datastore."
      tags:
        - "api"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "JSON authentication request for a stored secret"
          required: true
          schema:
            type: "object"
            required:
              - "id"
              - "verifier"
            properties:
              id:
                type: "string"
                description: "Secret ID returned at creation time"
              verifier:
                type: "string"
                description: "Verifier string used to authenticate the request"
      responses:
        "200":
          description: "OK"
          schema:
            type: "object"
            properties:
              encrypted_secret:
                type: "string"
                description: "The encrypted secret payload"
              views_remaining:
                type: "integer"
                description: "Number of views remaining after this retrieval"
              expires_at:
                type: "integer"
                description: "Unix timestamp when the secret expires"
        "400":
          description: "Bad Request"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Bad Request"
        "401":
          description: "Unauthorized"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Invalid authorization"
        "404":
          description: "Not Found"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Not found or expired"